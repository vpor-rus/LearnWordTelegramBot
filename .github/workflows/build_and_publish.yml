name: Build and Publish

on:
  push:
    branches:
      - master # имя основной ветки

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '23'

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew shadowJar

      - name: List build directory
        run: |
          echo "Listing all files in build directory:"
          find build -name "*.jar" -type f

      - name: Rename file
        run: mv build/libs/LearnWordTelegramBot-1.0-SNAPSHOT-all.jar bot.jar

      - name: Upload artifact
        uses: actions/upload-artifact@v4  
        with:
          name: bot-jar
          path: bot.jar

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts
          echo "SSH key setup complete"
          
      - name: Deploy manually
        run: |
          scp -P ${{ secrets.PORT }} bot.jar ${{ secrets.USERNAME }}@${{ secrets.HOST }}:/home/${{ secrets.USERNAME }}/bot/
          ssh -p ${{ secrets.PORT }} ${{ secrets.USERNAME }}@${{ secrets.HOST }} "cd /home/${{ secrets.USERNAME }}/bot && ./restart.sh"
